<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Base Dark Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- Feature Nodes & Network -->
  <g stroke="url(#line-grad)" stroke-width="2.5" fill="none">
    <path d="M 720 220 L 850 160 L 1000 240 L 920 380 L 780 340 Z"/>
    <path d="M 850 160 L 920 380"/>
    <path d="M 720 220 L 1000 240"/>
    <path d="M 920 380 L 1080 440"/>
    <path d="M 1000 240 L 1110 200"/>
    <path d="M 780 340 L 700 460 L 860 500 L 920 380"/>
  </g>

  <!-- Feature Map Nodes -->
  <g filter="url(#glow)">
    <circle cx="720" cy="220" r="9" fill="#38bdf8"/>
    <circle cx="850" cy="160" r="11" fill="#818cf8"/>
    <circle cx="1000" cy="240" r="12" fill="#c084fc"/>
    <circle cx="920" cy="380" r="10" fill="#34d399"/>
    <circle cx="780" cy="340" r="8" fill="#f472b6"/>
    <circle cx="1080" cy="440" r="7" fill="#38bdf8"/>
    <circle cx="1110" cy="200" r="6" fill="#fbbf24"/>
    <circle cx="700" cy="460" r="8" fill="#818cf8"/>
    <circle cx="860" cy="500" r="9" fill="#34d399"/>
  </g>

  <!-- Branding Text & Badges -->
  <g transform="translate(90, 220)">
    <!-- Tagline Badge -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="21" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" text-anchor="middle">DEEPSEEK HARNESS PLUGIN</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">dsh-feature-map</text>

    <!-- Description Subtitle -->
    <text x="0" y="142" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      Docs before code: one page per feature so your agent stops grepping and starts knowing.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 190)" font-family="'JetBrains Mono', monospace" font-size="13">
      <!-- Updated Tag 1: Map -->
      <rect x="0" y="0" width="100" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="50" y="19" fill="#cbd5e1" text-anchor="middle">⚡ Map</text>

      <!-- Tag 2 -->
      <rect x="112" y="0" width="145" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="184.5" y="19" fill="#cbd5e1" text-anchor="middle">🗺️ Feature Docs</text>

      <!-- Tag 3 -->
      <rect x="269" y="0" width="130" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="334" y="19" fill="#cbd5e1" text-anchor="middle">🤖 Agent First</text>
    </g>
  </g>
</svg>
